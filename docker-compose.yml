services:
  postgres:
    # PostgreSQL 17 with the pgvector extension (needed by migration 003_rag.sql).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_vision}
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/infrastructure/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant} -d ${POSTGRES_DB:-restaurant_vision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Workflow automation: ticket/login emails, Google Sheets inventory, scheduled reports.
  # Workflows are versioned in infra/n8n/ and imported with `npm run n8n:import`.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["automation"]
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Dhaka
      TZ: Asia/Dhaka
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      SEESERVE_API_URL: ${N8N_SEESERVE_API_URL:-http://host.docker.internal:4000}
      SEESERVE_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-change-me}
      SEESERVE_MCP_TOKEN: ${MCP_HTTP_TOKEN:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./infra/n8n:/workflows:ro

  # Optional: run Ollama in Docker instead of installing it natively (CPU only by default).
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
